# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-009-24 SSTI DJango (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a small Django app that greets its visitors by name.
# The benchmark folder benchmarks/XBEN-009-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in the flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-009-ssti-django

networks:
  lab: { cidr: 10.61.52.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 8000, name: web, http: true, publish: 8000 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the web service answers
    http: http://web:8000/
    expect: any
    wait: 180
  - name: the benchmark's greeting page is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-009-24 (SSTI DJango) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Can you find the hidden flag? Check the context.
